<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sky Shooter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Main Menu -->
    <div id="menu-screen" class="screen active">
      <div class="menu-content">
        <!-- Logo SVG -->
        <div class="logo-wrap" aria-label="Sky Shooter">
          <svg class="logo-svg" viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="8" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#00ffee"/>
                <stop offset="50%"  stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#0088ff"/>
              </linearGradient>
              <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#ff6b35"/>
                <stop offset="100%" stop-color="#ff2244"/>
              </linearGradient>
              <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#00ffee"/>
                <stop offset="100%" stop-color="#0088bb"/>
              </linearGradient>
            </defs>

            <!-- Engine trail glow -->
            <ellipse cx="14" cy="55" rx="22" ry="9" fill="rgba(255,120,0,0.35)" filter="url(#glow)"/>

            <!-- Ship body -->
            <polygon points="52,55 16,38 22,55 16,72" fill="url(#shipGrad)" filter="url(#glow)"/>
            <!-- Wing -->
            <polygon points="24,55 34,40 40,55 34,70" fill="#0088bb"/>
            <!-- Cockpit -->
            <ellipse cx="38" cy="55" rx="7" ry="5" fill="#00ffcc" filter="url(#glow)"/>
            <!-- Muzzle flash -->
            <ellipse cx="58" cy="55" rx="9" ry="4" fill="rgba(255,220,80,0.85)" filter="url(#glow-strong)">
              <animate attributeName="rx" values="9;5;9" dur="0.4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.85;0.4;0.85" dur="0.4s" repeatCount="indefinite"/>
            </ellipse>
            <!-- Bullet streak -->
            <rect x="62" y="53" width="28" height="4" rx="2" fill="rgba(255,220,80,0.7)" filter="url(#glow)">
              <animate attributeName="width" values="28;14;28" dur="0.4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.4s" repeatCount="indefinite"/>
            </rect>

            <!-- SKY -->
            <text x="96" y="58" font-family="'Courier New', monospace" font-size="44"
                  font-weight="900" letter-spacing="4"
                  fill="url(#titleGrad)" filter="url(#glow-strong)">SKY</text>

            <!-- SHOOTER on second line, slightly smaller -->
            <text x="96" y="90" font-family="'Courier New', monospace" font-size="28"
                  font-weight="700" letter-spacing="10"
                  fill="url(#subGrad)" filter="url(#glow)">SHOOTER</text>

            <!-- Decorative line under SKY -->
            <line x1="96" y1="65" x2="330" y2="65" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.3"/>
          </svg>
        </div>
        <p class="subtitle">Survive. Shoot. Score.</p>
        <button id="btn-start" class="btn-primary">PLAY</button>
        <div class="controls-hint">
          <p>🖱️ Right click / Right button = Jump</p>
          <p>🖱️ Left click / Left button = Shoot</p>
        </div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
      <canvas id="game-canvas"></canvas>

      <!-- HUD -->
      <div id="hud">
        <div id="score-display">SCORE: <span id="score-value">0</span></div>
        <div id="status-display" class="status-alive">ALIVE</div>
      </div>

      <!-- Mobile Controls -->
      <div id="mobile-controls">
        <button id="btn-shoot" class="control-btn left-btn">
          <span class="btn-icon">💥</span>
          <span class="btn-label">SHOOT</span>
        </button>
        <button id="btn-jump" class="control-btn right-btn">
          <span class="btn-icon">⬆</span>
          <span class="btn-label">JUMP</span>
        </button>
      </div>

      <!-- Pause Overlay -->
      <div id="pause-overlay">
        <div class="pause-content">
          <h2 class="pause-title">PAUSED</h2>
          <p class="pause-hint">Press ESC to resume</p>
          <button id="btn-pause-menu" class="btn-secondary">MENU</button>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
      <div class="gameover-content">
        <h2 class="gameover-title">GAME OVER</h2>
        <div class="final-stats">
          <div class="stat-row">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="final-score">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="final-time">0s</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">DESTROYED</span>
            <span class="stat-value" id="final-destroyed">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">BEST</span>
            <span class="stat-value" id="best-score">0</span>
          </div>
        </div>
        <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
        <button id="btn-menu" class="btn-secondary">MENU</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
